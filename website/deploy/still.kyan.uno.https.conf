server {
    listen 80;
    listen [::]:80;
    server_name still.kyan.uno;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://still.kyan.uno$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name still.kyan.uno;

    ssl_certificate /etc/letsencrypt/live/still.kyan.uno/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/still.kyan.uno/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/still/current;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;
    etag on;
    gzip_static on;
    gzip_vary on;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    location ~ (^|/)\. {
        return 404;
    }

    location = /downloads {
        return 404;
    }

    location /downloads/ {
        alias /var/www/still/downloads/;
        types { text/plain txt; }
        default_type application/octet-stream;
        autoindex off;
        gzip off;
        gzip_static off;
        max_ranges 1;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location ~* "^/assets/(?:.*/)?[^/]+-[a-z0-9_-]{8,}\.(?:css|js|mjs|wasm|png|jpe?g|webp|avif|svg|ico|woff2?|ttf|otf)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
